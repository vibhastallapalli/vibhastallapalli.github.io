<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; overflow-x: hidden; }
        #viewer { display: flex; flex-direction: column; align-items: center; }
        canvas { width: 100%; height: auto; display: block; }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        pdfjsLib.getDocument('Assets/resume.pdf').promise.then(function(pdf) {
            var viewer = document.getElementById('viewer');
            var containerWidth = document.documentElement.clientWidth;
            var dpr = window.devicePixelRatio || 1;

            function renderPage(num) {
                return pdf.getPage(num).then(function(page) {
                    var unscaled = page.getViewport({ scale: 1 });
                    var scale = (containerWidth / unscaled.width) * dpr;
                    var viewport = page.getViewport({ scale: scale });
                    var canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    canvas.style.width = '100%';
                    canvas.style.height = 'auto';
                    viewer.appendChild(canvas);
                    return page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
                });
            }

            var chain = Promise.resolve();
            for (var i = 1; i <= pdf.numPages; i++) {
                (function(n) {
                    chain = chain.then(function() { return renderPage(n); });
                })(i);
            }
        });
    </script>
</body>
</html>
